<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" width="660" height="210" role="img" aria-label="Innova Digital - Conectamos ideas, impulsamos resultados" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Fondo blanco -->
  <rect width="660" height="210" fill="#FFFFFF"/>

  <!-- Símbolo: círculo (conexión global) + D estilizada + píxeles -->
  <g transform="translate(20,15)">
    <circle cx="90" cy="90" r="80" fill="#FFFFFF" stroke="url(#ring)" stroke-width="10"/>

    <!-- D estilizada -->
    <path fill="#1D4ED8" fill-rule="evenodd"
          d="M60 50 h32 a40 40 0 0 1 0 80 h-32 z M77 66 v48 h15 a24 24 0 0 0 0 -48 z"/>

    <!-- Píxeles / líneas tecnológicas -->
    <rect x="30" y="72" width="9" height="9" rx="1.5" fill="#22C55E"/>
    <rect x="43" y="59" width="9" height="9" rx="1.5" fill="#16A34A"/>
    <rect x="43" y="85" width="9" height="9" rx="1.5" fill="#22C55E"/>
    <rect x="30" y="98" width="9" height="9" rx="1.5" fill="#86EFAC"/>
    <rect x="43" y="111" width="9" height="9" rx="1.5" fill="#16A34A"/>

    <!-- Nodo de conexión sobre el círculo -->
    <circle cx="146" cy="38" r="9" fill="#FFFFFF" stroke="#22C55E" stroke-width="5"/>
  </g>

  <!-- Nombre -->
  <text x="222" y="95" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#0F2A5C">Innova</text>
  <text x="222" y="150" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="300" fill="url(#verde)">Digital</text>

  <!-- Eslogan -->
  <text x="224" y="181" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" font-style="italic" fill="#475569">Conectamos ideas, impulsamos resultados.</text>
</svg>
