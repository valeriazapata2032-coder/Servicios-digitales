<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 170" role="img" aria-labelledby="titulo descripcion" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titulo">Innova Digital</title>
  <desc id="descripcion">Logo de Innova Digital: círculo azul con una letra D hecha de píxeles. Eslogan: Conectamos ideas, impulsamos resultados.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0B2A6F"/>
    </linearGradient>
  </defs>
  <style>
    .nombre{font:700 48px 'Poppins','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .eslogan{font:500 16px 'Poppins','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .innova{fill:#0B2A6F}
    .digital{fill:#16A34A}
    .frase{fill:#475569}
    @media (prefers-color-scheme:dark){
      .innova{fill:#F8FAFC}
      .digital{fill:#4ADE80}
      .frase{fill:#CBD5E1}
    }
  </style>

  <!-- Icono: círculo con la D de píxeles -->
  <g transform="translate(5 5)">
    <circle cx="80" cy="80" r="76" fill="none" stroke="#22C55E" stroke-width="4"/>
    <circle cx="80" cy="80" r="69" fill="url(#fondo)"/>
    <g shape-rendering="crispEdges">
      <path fill="#FFFFFF" d="M36 42h9v9h-9z M36 53h9v9h-9z M36 64h9v9h-9z M36 75h9v9h-9z M36 86h9v9h-9z M36 97h9v9h-9z M36 108h9v9h-9z M47 42h9v9h-9z M58 42h9v9h-9z M69 42h9v9h-9z M47 108h9v9h-9z M58 108h9v9h-9z M69 108h9v9h-9z"/>
      <path fill="#22C55E" d="M80 53h9v9h-9z M91 64h9v9h-9z M91 75h9v9h-9z M91 86h9v9h-9z M80 97h9v9h-9z"/>
      <path fill="#22C55E" opacity=".9" d="M104 69h7v7h-7z M104 84h7v7h-7z"/>
      <path fill="#FFFFFF" opacity=".75" d="M115 62h5v5h-5z M115 78h5v5h-5z M115 94h5v5h-5z"/>
      <path fill="#FFFFFF" opacity=".5" d="M125 70h3v3h-3z M125 87h3v3h-3z"/>
    </g>
  </g>

  <!-- Nombre y eslogan -->
  <text x="188" y="84" class="nombre" textLength="400" lengthAdjust="spacing"><tspan class="innova">Innova</tspan> <tspan class="digital">Digital</tspan></text>
  <text x="190" y="116" class="eslogan frase" textLength="360" lengthAdjust="spacing">Conectamos ideas, impulsamos resultados.</text>
</svg>
